<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bautizo - Joshua</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Pinyon+Script&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #fcfaf8;
            --bg-bayou: linear-gradient(135deg, #f5eadd 0%, #e6d3c0 100%);
            --gold-primary: #c5a880;
            --gold-secondary: #e8dcca;
            --text-light: #4a4138;
            --text-muted: #96887a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* --- Sobre Premium --- */
        #envelope-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-bayou); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        #envelope-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .envelope-wrapper {
            position: relative; cursor: pointer;
            transition: transform 0.5s ease;
        }

        .envelope {
            position: relative; width: 340px; height: 240px;
            background: #dccab5; border-radius: 0 0 8px 8px;
            box-shadow: 0 20px 40px rgba(74, 65, 56, 0.2);
        }

        .front-flap {
            position: absolute; top: 0; left: 0;
            border-left: 170px solid transparent; border-right: 170px solid transparent;
            border-top: 130px solid var(--gold-primary);
            transform-origin: top; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .envelope-wrapper.open .front-flap { transform: rotateX(180deg); }

        .wax-seal {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; background: var(--bg-dark); border-radius: 50%;
            z-index: 5; display: flex; justify-content: center; align-items: center;
            border: 2px solid var(--gold-primary); transition: all 0.5s ease;
        }

        .envelope-wrapper.open .wax-seal { transform: translateX(-50%) scale(0); opacity: 0; }

        /* --- Audio Control --- */
        #audio-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 998;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--text-light); color: #fff;
            border: 2px solid var(--gold-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- Carrusel --- */
        .carousel-container {
            width: 100%; display: flex; overflow-x: auto;
            scroll-snap-type: x mandatory; gap: 15px; padding: 10px 0;
            margin: 20px 0; scrollbar-width: none;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-container img {
            width: 85%; flex: 0 0 auto; scroll-snap-align: center;
            border-radius: 4px; border: 1px solid var(--gold-secondary);
        }

        /* --- Estilos base originales --- */
        #main-invitation { min-height: 100vh; padding: 60px 20px; opacity: 0; transition: opacity 1.5s; }
        body.content-active #main-invitation { opacity: 1; }
        .invitation-frame { max-width: 500px; margin: 0 auto; border: 1px solid var(--gold-secondary); padding: 40px 30px; text-align: center; background: rgba(252, 250, 248, 0.9); }
        .main-title { font-family: 'Pinyon Script', cursive; font-size: 65px; margin-bottom: 15px; }
        .section-tag { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 5px; color: var(--text-muted); text-transform: uppercase; margin: 20px 0; }
        .btn-whatsapp { display: inline-block; padding: 14px 30px; background: var(--text-light); color: #ffffff; text-decoration: none; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px; margin-top: 15px; }
        .divider { width: 60px; height: 1px; background: var(--gold-primary); margin: 25px auto; }
        .info-block { margin-bottom: 30px; }
        .info-label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; color: var(--text-muted); }
        .name-main { font-family: 'Cinzel', serif; font-size: 17px; margin-top: 5px; }
    </style>
</head>

<body>

    <audio id="music" loop>
        <source src="assets/song.mp3" type="audio/mpeg">
    </audio>

    <button id="audio-btn" onclick="toggleMusic()">♪</button>

    <div id="envelope-screen">
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="front-flap"></div>
            <div class="wax-seal"><img src="assets/icono.png" width="30" alt="Icono"></div>
            <div class="envelope"></div>
            <div style="margin-top: 30px; font-family: 'Cinzel'; text-transform: uppercase; letter-spacing: 2px;">Toca el sello</div>
        </div>
    </div>

    <main id="main-invitation">
        <div class="invitation-frame">
            <div class="section-tag">Mi Bautizo</div>
            <h1 class="main-title" id="main-nombre">Joshua</h1>
            
            <!-- Carrusel de fotos -->
            <div class="carousel-container">
                <img src="assets/foto1.jpg" alt="Foto 1">
                <img src="assets/foto2.jpg" alt="Foto 2">
                <img src="assets/foto3.jpg" alt="Foto 3">
            </div>

            <p style="font-style: italic; margin-bottom: 25px;">"Con inmensa alegría comparto este día especial."</p>
            
            <div class="divider"></div>

            <div class="info-block">
                <div class="info-label">Mis Padres</div>
                <div class="name-main">Josué González Pérez</div>
                <div class="name-main">Zaira Romero López</div>
            </div>

            <div class="divider"></div>

            <div class="section-tag">Mesa de Regalos</div>
            <a href="https://mesaderegalos.liverpool.com.mx/milistaderegalos/52010432" target="_blank" class="btn-whatsapp">Ver Mesa de Regalos</a>
        </div>
    </main>

    <script>
        const music = document.getElementById('music');
        const audioBtn = document.getElementById('audio-btn');
        let isPlaying = false;

        function openEnvelope() {
            document.querySelector('.envelope-wrapper').classList.add('open');
            setTimeout(() => {
                document.getElementById('envelope-screen').classList.add('fade-out');
                document.body.classList.add('content-active');
                toggleMusic();
            }, 800);
        }

        function toggleMusic() {
            if (music.paused) {
                music.play();
                audioBtn.innerText = '♪';
                isPlaying = true;
            } else {
                music.pause();
                audioBtn.innerText = '❚❚';
                isPlaying = false;
            }
        }
    </script>
</body>
</html>
